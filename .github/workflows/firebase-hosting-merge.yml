name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
env:
  FIREBASE_PROJECT_ID: divarogue-e7d19
  FIREBASE_HOSTING_TARGET: ani-flowers
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: "npm ci && npm run generate"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIFLOWERS }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.FIREBASE_HOSTING_TARGET }}

      - name: Send Discord notification
        run: |
          LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \" 🎸 [Ani Flowers](https://ani-flowers.store) deployed! Commit: **$LAST_COMMIT_MESSAGE**\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
